<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon suivi piano · répertoire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap">
<style>
:root{--bg:#f3f1f8;--card:#fff;--ink:#1d1b2e;--muted:#6f6b85;--line:#e4e0ef;--accent:#6c4cf0;--accent-soft:#ece7ff;--lt:48%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121c;--card:#1d1b2b;--ink:#eeecf7;--muted:#a19db6;--line:#2f2c42;--accent:#a08bff;--accent-soft:#2a2448;--lt:58%}}
:root[data-theme="dark"]{--bg:#13121c;--card:#1d1b2b;--ink:#eeecf7;--muted:#a19db6;--line:#2f2c42;--accent:#a08bff;--accent-soft:#2a2448;--lt:58%}
html.embed body{background:transparent}html.embed h1{display:none}html.embed .app{padding-top:4px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.app{height:100dvh;display:flex;flex-direction:column;padding:8px 14px 8px;gap:6px;max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;flex:none}
h1{margin:0;font-size:1.05rem;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.84rem;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.grow{flex:1}
.sum{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{white-space:nowrap;position:relative;border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:38px;height:38px;font-weight:800;padding:0 12px}
.ib.on:after{content:"";position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
/* mur de pastilles : tient dans l'écran */
.wall{flex:1;min-height:0;display:grid;gap:8px;justify-content:center;align-content:center;grid-template-columns:repeat(var(--cols,5),var(--pw,180px));grid-auto-rows:var(--ph,140px)}
.pill{position:relative;border:1px solid #d9d3c4;border-radius:18px;background:linear-gradient(180deg,#fffdf8 0%,color-mix(in srgb,var(--c) 20%,#fffdf8) 100%);box-shadow:0 2px 0 #cfc8b6,0 6px 10px rgba(40,30,70,.08);color:#1d1b2e;font-family:Outfit,system-ui,sans-serif;padding:0 9px 9px;text-align:center;display:flex;flex-direction:column;align-items:stretch;gap:3px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;isolation:isolate;touch-action:manipulation;min-height:0}
.pill.full{border-color:var(--c);box-shadow:0 2px 0 var(--c),0 6px 10px rgba(40,30,70,.08)}
.pill .no{align-self:center;flex:none;min-width:44px;height:26px;padding:0 10px;background:#1d1b2e;color:#fff;border-radius:0 0 10px 10px;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 5px rgba(0,0,0,.25);z-index:2}
.band{flex:none;width:calc(100% + 18px);margin:0 -9px;height:var(--bh,54px);position:relative}
.band svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.pill .t{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs,1.05rem);line-height:1.12;padding:3px 3px 0;min-height:0}
.pill .nm{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ed{position:absolute;top:3px;right:3px;border:0;background:transparent;border-radius:8px;width:28px;height:28px;font-size:.8rem;color:#6f6b85;padding:0;z-index:3}
.ed:hover{color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:1.4em;align-items:center}
.chip{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(29,27,46,.08);white-space:nowrap;line-height:1.35}
.chip.q{background:transparent;border:1px dashed rgba(29,27,46,.3);color:rgba(29,27,46,.5);font-weight:600}
.pill.small .no{height:18px;min-width:34px;font-size:.74rem;padding:0 8px}
.kn{flex:none;height:12px;line-height:12px;font-size:.68rem;font-weight:800;color:#3a3650;text-align:center;white-space:nowrap;overflow:hidden}
.pill.small .kn{font-size:.64rem}
.pill.small .chips{flex-wrap:nowrap;overflow:hidden;gap:3px;min-height:15px;justify-content:center}.pill.small .chip{font-size:.62rem;padding:0 6px;flex:none}
.pill.small{gap:2px;padding:0 6px 6px}.pill.small .band{width:calc(100% + 12px);margin:0 -6px}
.pill.tiny .band,.pill.tiny .chips,.pill.tiny .kn{display:none}
.sugbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px;padding:4px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;flex:none;font-size:.82rem}
.sugbar b{color:var(--accent);white-space:nowrap}
.sugbar .sg{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 11px;font-weight:700;border:0}
.sugbar .why{color:var(--muted);font-size:.76rem}
.pill.sug{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.star{position:absolute;top:3px;right:7px;font-size:.85rem;color:var(--accent);z-index:3;line-height:1}
.nb{position:absolute;top:4px;left:6px;font-size:.7rem;font-weight:800;color:#6f6b85;z-index:3}
.note{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.note small{color:var(--muted);font-weight:700;font-size:.72rem;display:flex;gap:8px;align-items:center}
.note p{margin:0;white-space:pre-wrap}
.note small button+button{margin-left:0}.note small button{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem}
.dict{font:inherit;color:var(--ink);width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);resize:vertical;line-height:1.4}
.mic{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800}
.mic.rec{background:#e5484d;border-color:#e5484d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.25)}}
.dnote{font-size:.76rem;color:var(--muted)}
.pill.add{border:2px dashed var(--muted);background:transparent;box-shadow:none;color:var(--muted);align-items:center;justify-content:center;font-weight:800;font-size:1rem;cursor:pointer;gap:6px;padding:8px}
.pill.add b{font-size:2rem;line-height:1;color:var(--accent)}
.cr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:center}
.cr i{height:8px;border-radius:3px;background:rgba(120,110,150,.25)}
.cr i.on{background:var(--c)}
.cr b{display:none}
.n{font-variant-numeric:tabular-nums;font-weight:800;font-size:.72rem;color:var(--c);text-align:right;line-height:1}
.low{padding:4px 0;color:var(--muted)}
/* popups */
.mod{position:fixed;inset:0;background:rgba(10,8,25,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.mod.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:94dvh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.mh h3{margin:0;font-size:1.02rem;flex:1}
.mb{padding:12px 18px;overflow:auto;display:flex;flex-direction:column;gap:13px}
.mf{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fl{display:flex;flex-direction:column;gap:6px}.fl>b{font-size:.78rem;color:var(--muted)}
.fl input[type=text],.fl select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tl{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;font-weight:800;font-size:.92rem}
.tl .i{font-size:1.9rem;line-height:1.1}.tl small{font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.25}
.tl:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.addtag{display:flex;gap:6px}.addtag input{flex:1;min-width:0}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:600}
.big{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;padding:10px 18px}.big:disabled{opacity:.4}
.x{border:0;background:transparent;font-size:1.1rem;color:var(--muted)}
.help p{margin:0 0 8px}.help .g{display:flex;gap:3px;margin:4px 0 8px}.help .g i{width:26px;height:10px;border-radius:3px;background:var(--c)}
.help small{color:var(--muted)}
.mbox.mid{width:min(780px,98vw);max-height:95dvh}
.mlist{overflow:auto;max-height:50vh}
.mplan{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;margin-bottom:8px}
.mplan .chip2{background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 11px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.mplan .chip2 button{border:0;background:transparent;color:var(--accent);font-size:.9rem;padding:0 3px}
.mtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.76rem;color:var(--muted);margin-bottom:6px}
.mtools select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 6px}
.fr{display:inline-flex;align-items:center;gap:4px}.fr i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mr{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:.86rem}
.mr .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.mr .t2{font-weight:700}.mr .t2 small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.mr button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:700;white-space:nowrap}
.mr button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* ma semaine */
.days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-content:stretch}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;text-align:left}
.day.clk{cursor:pointer}.day.clk:hover{border-color:var(--accent)}
.day.now{border:2px solid var(--accent)}.day.fut{background:transparent;border-style:dashed}
.day b{font-size:.95rem}.day .dots{display:flex;flex-wrap:wrap;gap:3px}.day .dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.day .n{font-size:.76rem;color:var(--muted);font-weight:600}.day .pn{display:block;font-size:.8rem;font-weight:700;line-height:1.25}
.day .add{color:var(--accent);font-weight:700;font-size:.8rem}
@media (max-width:760px){.days{grid-template-columns:1fr;overflow:auto;gap:6px}.day{flex-direction:row;flex-wrap:wrap;align-items:center}.day .pn{display:inline}.day .pn:not(:last-child):after{content:' · '}}
/* bilan */
.bbox{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bsub{margin:0 0 8px;color:var(--muted);font-size:.86rem;flex:none}
.blist{flex:1;min-height:0;overflow:auto}
.bi{display:grid;grid-template-columns:28px 1.4fr auto 1.2fr;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}.bi:first-child{border-top:0}
.bi .o{font-weight:800;color:var(--muted)}.bi .t2{font-weight:700}.bi .t2 small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
.err{display:flex;gap:4px}.err button{width:38px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:800;font-size:.85rem}
.err button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sgb{font-size:.82rem}.sgb .up{color:#1f9d62;font-weight:800}.sgb .down{color:#e0484f;font-weight:800}.sgb .eq{color:var(--muted)}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);flex:none}
.valid{border:0;border-radius:12px;background:#1f9d62;color:#fff;font-weight:800;padding:10px 18px}.valid:disabled{opacity:.4}
.done{padding:10px 14px;border-radius:12px;background:rgba(31,157,98,.15);color:#1f9d62;font-weight:700;margin-top:8px;flex:none}
@media (max-width:760px){.bi{grid-template-columns:24px 1fr}.bi .err,.bi .sgb{grid-column:2}}
.mbox.wide{width:min(1040px,98vw);max-height:97dvh}
.mbox.wide .mh{padding:8px 18px}.mbox.wide .mf{padding:8px 18px}.mbox.wide .mb{padding:10px 18px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;align-items:start}
.col{display:flex;flex-direction:column;gap:11px;min-width:0}
.mbox.wide .opt{padding:4px 10px;font-size:.78rem}
.mbox.wide .opts{gap:5px}
.mbox.wide .dict{min-height:78px;max-height:120px}
.mbox.wide .nlist{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto}
.mbox.wide .wd{padding:4px 2px}.mbox.wide .wd b{font-size:1rem;margin:0}
.mbox.wide .mic,.mbox.wide .big{padding:7px 14px}
@media (max-width:720px){.c2{grid-template-columns:1fr}.mbox.wide .nlist{max-height:none}}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;background:var(--bg)}
.wd small{display:block;font-size:.68rem;color:var(--muted);font-weight:600}
.wd b{display:block;font-size:1.15rem;margin:2px 0}
.wd div{display:flex;gap:2px;justify-content:center}
.wd button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:26px;height:26px;padding:0;font-weight:800}
.wd.today{border-color:var(--accent)}
/* chronologie */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;flex:none}
.ptabs .seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;overflow:auto}
.ptabs .seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap}
.ptabs .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.pbox{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pctl,.pfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;flex:none}
.pctl{border-bottom:1px solid var(--line)}.pfoot{border-top:1px solid var(--line)}
.lab{font-size:.78rem;color:var(--muted);font-weight:600}
.pctl input[type=time],.pfoot select{border:1px solid var(--line);border-radius:10px;padding:5px 8px;background:var(--bg);max-width:100%}
.plist{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(var(--pc,2),minmax(0,1fr));grid-auto-rows:min-content;align-content:start}
.pr{display:grid;grid-template-columns:18px 22px 1fr auto auto;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);min-height:40px}
.pr.drag{opacity:.4}.pr.over{box-shadow:inset 0 3px 0 var(--accent)}
.hd{cursor:grab;color:var(--muted);text-align:center}.pr .o{font-weight:800;color:var(--muted);font-size:.82rem}
.pr .t{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .clk{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:.85rem;line-height:1.1}
.pr .clk small{display:block;font-weight:500;color:var(--muted);font-size:.68rem}
.pr .mv{display:flex;gap:3px}.pr .mv button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:28px;height:28px;padding:0;font-size:.8rem}
.empty{padding:22px;text-align:center;color:var(--muted);grid-column:1/-1}
.runc{flex:1;padding:16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.runc .t{font-size:2rem;font-weight:800}.runc .clk{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
.runc .b{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.runc .nn{color:var(--muted);font-weight:700}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:none;gap:10px;align-items:center;font-weight:600;font-size:.86rem;z-index:30}
#toast.on{display:flex}#toast button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700}
@media (max-width:700px){.sum{display:none}h1{display:none}.pr{grid-template-columns:22px 1fr auto auto}.pr .hd{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>🎹 Mon répertoire</h1>
    <div class="tabs"><button data-v="week" aria-pressed="true">Aujourd'hui</button><button data-v="plan" aria-pressed="false">Ma semaine</button><button data-v="chrono" aria-pressed="false">Chronologie</button><button data-v="bilan" aria-pressed="false">Bilan</button></div>
    <span class="grow"></span><span class="sum" id="sum"></span>
    <button class="ib" id="btools" style="display:none" title="Mes autres outils : cours, quiz, accords…">🧰 Outils</button>
    <button class="ib" id="bboog" style="display:none" title="Formation Boogie-Woogie">🕺 <span id="bwn"></span></button>
    <button class="ib" id="bfilt" title="Trier, filtrer, réglages">⚙ Trier / filtrer</button>
    <button class="ib" id="bhelp" title="Aide">?</button></div>

  <section class="view" id="v-week"><div class="sugbar" id="sugbar"></div><div class="wall" id="wall"></div></section>

  <section class="view" id="v-plan" hidden><div class="days" id="days"></div></section>

  <section class="view" id="v-bilan" hidden><p class="bsub" id="bsub"></p><div class="bbox"><div class="blist" id="bl"></div><div class="bfoot"><span class="n" style="color:var(--muted);font-weight:600" id="bsum"></span><button class="valid" id="bval">✓ Valider le bilan</button></div></div><div id="bdone"></div></section>

  <section class="view" id="v-chrono" hidden><div class="ptabs" id="ptabs"></div><div class="pbox" id="pbody"></div></section>
</div>

<div class="mod" id="mod"><div class="mbox"><div class="mh"><h3 id="mtitle"></h3><button class="x" id="mclose">✕</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div id="toast"><span id="ttxt"></span><button id="tund">Annuler</button></div>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
var KEY="sp-v2";
var EMBED=window.parent!==window; if(EMBED) document.documentElement.classList.add("embed");
function toParent(m){ try{ window.parent.postMessage(m,"*"); }catch(e){} }
var DIF={1:{n:"facile",d:"●○○"},2:{n:"intermédiaire",d:"●●○"},3:{n:"difficile",d:"●●●"}};

  $$("#mbody [data-pt]").forEach(function(b){ b.onclick=function(){ var a=S.pts[i], k=a.indexOf(b.dataset.pt); if(k<0) a.push(b.dataset.pt); else a.splice(k,1); save(); drawFiche(); }; });
  $("#flove2").onclick=function(){ S.love[i]=!S.love[i]; save(); drawFiche(); };
  $("#fdur").onchange=function(){ var v=this.value.trim(); if(v===""){ S.dur[i]=0; } else { var x=pd(v); if(x!==null&&x>0) S.dur[i]=x; } save(); drawFiche(); };
  var addTag=function(){ var v=$("#ftag").value.trim(); if(!v) return; if(allPts().indexOf(v)<0) S.custom.push(v); if(S.pts[i].indexOf(v)<0) S.pts[i].push(v); save(); drawFiche(); };
  $("#ftagok").onclick=addTag; $("#ftag").onkeydown=function(e){ if(e.key==="Enter") addTag(); };
}
/* ---- chronologie ---- */
var RUN=null;
function tagsTxt(i){ var a=[]; if(S.dif[i]) a.push(DIF[S.dif[i]].d); if(S.res[i]) a.push(RES[S.res[i]]); return a.join(" · "); }
function curProg(){ return S.progs.filter(function(p){return p.id===S.pcur;})[0]||S.progs[0]; }
function estS(i){ return S.dur[i]||180; }
function clock(start,sec){ var m=/^(\d{1,2}):(\d{2})$/.exec(start||"18:00"); var t=Math.round(((+m[1]*60+ +m[2])*60+sec)/60); return ("0"+(Math.floor(t/60)%24)).slice(-2)+":"+("0"+(t%60)).slice(-2); }
function proposeOrder(ids){
  var dv=function(i){ return S.dif[i]||2; }, fl=function(i){ return (S.res[i]==="fluide"||S.res[i]==="stable")?0:S.res[i]===""?1:2; };
  var rest=ids.slice(), warm=null, end=null;
  var w=rest.slice().sort(function(a,b){ return fl(a)-fl(b)||dv(a)-dv(b)||a-b; })[0]; if(w!==undefined){ warm=w; rest.splice(rest.indexOf(w),1); }
  var loves=rest.filter(function(i){return S.love[i];}).sort(function(a,b){ return fl(a)-fl(b)||a-b; });
  if(loves.length){ end=loves[0]; rest.splice(rest.indexOf(end),1); }
  rest.sort(function(a,b){ return dv(b)-dv(a)||fl(b)-fl(a)||a-b; });
  var mid=new Array(rest.length), c=Math.floor((rest.length-1)/2);
  rest.forEach(function(i,n){ var pos=n%2===0?c-Math.floor(n/2):c+1+Math.floor((n-1)/2); mid[pos]=i; });
  mid=mid.filter(function(x){return x!==undefined;});
  return (warm!==null?[warm]:[]).concat(mid,end!==null?[end]:[]);
}
function drawChrono(){
  var P=curProg(), body=$("#pbody");
  $("#ptabs").innerHTML='<div class="seg">'+S.progs.map(function(p){ return '<button data-p="'+p.id+'" aria-pressed="'+(p.id===P.id)+'">'+esc(p.name)+'</button>'; }).join("")+'</div><button class="mini" id="pnew">+ Programme</button><button class="mini" id="pren">✎</button>'+(S.progs.length>1?'<button class="mini" id="pdel">✕</button>':'');
  $$("#ptabs [data-p]").forEach(function(b){ b.onclick=function(){ S.pcur=+b.dataset.p; RUN=null; save(); drawChrono(); }; });
  $("#pnew").onclick=function(){ var n=window.prompt("Nom du programme (ex. Concert, Plaisir) :","Nouveau programme"); if(n&&n.trim()){ var id=Math.max.apply(null,S.progs.map(function(p){return p.id;}))+1; S.progs.push({id:id,name:n.trim(),start:"18:00",ids:[]}); S.pcur=id; save(); drawChrono(); } };
  $("#pren").onclick=function(){ var n=window.prompt("Nouveau nom :",P.name); if(n&&n.trim()){ P.name=n.trim(); save(); drawChrono(); } };
  var pd_=$("#pdel"); if(pd_) pd_.onclick=function(){ if(window.confirm("Supprimer le programme « "+P.name+" » ?")){ S.progs=S.progs.filter(function(p){return p!==P;}); S.pcur=S.progs[0].id; save(); drawChrono(); } };
  if(RUN){ if(RUN.i>=P.ids.length){ var tot=RUN.rec.reduce(function(a,r){return a+r.sec;},0);
      body.innerHTML='<div class="runc"><span class="t">Programme terminé 🎉</span><span class="nn">'+RUN.rec.length+' morceaux joués · '+fd(tot)+' au total</span><div class="b"><button class="big" id="rend">Fermer</button></div></div>';
      $("#rend").onclick=function(){ RUN=null; drawAll(); }; return; }
    var i=P.ids[RUN.i], nx=P.ids[RUN.i+1];
    body.innerHTML='<div class="runc"><span class="nn">Morceau '+(RUN.i+1)+' / '+P.ids.length+'</span><span class="t">'+esc(nm(i))+(S.love[i]?' ❤':'')+'</span><span class="nn" style="font-weight:500">'+esc(tagsTxt(i))+'</span><span class="clk" id="runclk">'+fd((Date.now()-RUN.t0)/1000)+'</span>'+
      '<div class="b"><button class="big" id="rok">✓ Joué (+1) · suivant</button><button class="mini" id="rskip">Passer</button><button class="mini" id="rstop">Arrêter</button></div><span class="nn" style="font-weight:500">'+(nx!==undefined?'Ensuite : '+esc(nm(nx)):'Dernier morceau')+'</span></div>';
    $("#rok").onclick=function(){ var sec=(Date.now()-RUN.t0)/1000; add(i,today(),1); if(sec>=10) S.dur[i]=S.dur[i]?Math.round((S.dur[i]+sec)/2):Math.round(sec); RUN.rec.push({id:i,sec:sec}); RUN.i++; RUN.t0=Date.now(); save(); drawChrono(); };
    $("#rskip").onclick=function(){ RUN.i++; RUN.t0=Date.now(); drawChrono(); };
    $("#rstop").onclick=function(){ RUN=null; drawAll(); }; return; }
  var cum=0, rows=P.ids.map(function(i,k){ var st=clock(P.start,cum); cum+=estS(i);
    return '<div class="pr" draggable="true" data-k="'+k+'"><span class="hd" title="Glisser">⠿</span><span class="o">'+(k+1)+'</span><span class="t">'+esc(nm(i))+(S.love[i]?' ❤':'')+'</span><span class="clk">'+st+'<small>'+(S.dur[i]?fd(S.dur[i]):'≈ 3:00')+'</small></span><span class="mv"><button data-u="'+k+'" title="Monter">↑</button><button data-d="'+k+'" title="Descendre">↓</button><button data-r="'+k+'" title="Retirer">✕</button></span></div>'; }).join("");
  var avail=actives().filter(function(q){ return P.ids.indexOf(q)<0; });
  body.innerHTML='<div class="pctl"><label class="lab">Départ <input type="time" id="pstart" value="'+esc(P.start)+'"></label><button class="mini" id="psug">✨ Proposer un ordre</button><span class="grow"></span><span class="lab">'+P.ids.length+' morceaux · ≈ '+Math.round(cum/60)+' min · fin '+clock(P.start,cum)+'</span></div>'+
    '<div class="plist" id="plist">'+(rows||'<div class="empty">Programme vide : ajoute des morceaux ou clique sur « Proposer un ordre ».</div>')+'</div>'+
    '<div class="pfoot"><select id="padd"><option value="">+ Ajouter un morceau…</option>'+avail.map(function(q){return '<option value="'+q+'">'+esc(nm(q))+'</option>';}).join("")+'</select><button class="big" id="pgo" style="margin-left:auto"'+(P.ids.length?'':' disabled')+'>▶ Dérouler</button></div>';
  $("#plist").style.setProperty("--pc",window.innerWidth>=900&&P.ids.length>8?2:1);
  $("#pstart").onchange=function(){ P.start=this.value||"18:00"; save(); drawChrono(); };
  $("#psug").onclick=function(){ var base=P.ids.length?P.ids.slice():(function(){ var w=actives().filter(function(q){ return raw(q)>0; }); if(!w.length) w=actives(); return w; })();
    P.ids=proposeOrder(base); save(); drawChrono(); };
  $$("#pbody [data-u]").forEach(function(b){ b.onclick=function(){ var k=+b.dataset.u; if(k>0){ var t=P.ids[k]; P.ids[k]=P.ids[k-1]; P.ids[k-1]=t; save(); drawChrono(); } }; });
  $$("#pbody [data-d]").forEach(function(b){ b.onclick=function(){ var k=+b.dataset.d; if(k<P.ids.length-1){ var t=P.ids[k]; P.ids[k]=P.ids[k+1]; P.ids[k+1]=t; save(); drawChrono(); } }; });
  $$("#pbody [data-r]").forEach(function(b){ b.onclick=function(){ P.ids.splice(+b.dataset.r,1); save(); drawChrono(); }; });
  $("#padd").onchange=function(){ if(this.value!==""){ P.ids.push(+this.value); save(); drawChrono(); } };
  $("#pgo").onclick=function(){ RUN={i:0,t0:Date.now(),rec:[]}; drawChrono(); };
  var from=null;
  $$("#pbody .pr").forEach(function(r){
    r.ondragstart=function(e){ from=+r.dataset.k; r.classList.add("drag"); try{ e.dataTransfer.setData("text/plain",String(from)); e.dataTransfer.effectAllowed="move"; }catch(x){} };
    r.ondragend=function(){ r.classList.remove("drag"); $$("#pbody .pr").forEach(function(x){x.classList.remove("over");}); };
    r.ondragover=function(e){ e.preventDefault(); r.classList.add("over"); };
    r.ondragleave=function(){ r.classList.remove("over"); };
    r.ondrop=function(e){ e.preventDefault(); var to=+r.dataset.k; if(from===null||from===to) return; var it=P.ids.splice(from,1)[0]; P.ids.splice(to,0,it); from=null; save(); drawChrono(); };
  });
}
setInterval(function(){ if(RUN){ var e=$("#runclk"); if(e) e.textContent=fd((Date.now()-RUN.t0)/1000); } },250);
/* ---- global ---- */
function drawAll(){ drawWeek(); drawPlan(); drawChrono(); drawBilan(); bwUpdate(); }
$$(".tabs button").forEach(function(b){ b.onclick=function(){ $$(".tabs button").forEach(function(x){ x.setAttribute("aria-pressed",String(x===b)); }); ["week","plan","chrono","bilan"].forEach(function(v){ $("#v-"+v).hidden=v!==b.dataset.v; }); drawAll(); }; });
window.addEventListener("resize",function(){ drawAll(); });
window.addEventListener("message",function(e){ var m=e.data||{};
  if(m.type==="theme"){ document.documentElement.setAttribute("data-theme",m.theme); drawAll(); }
  if(m.type==="refresh"){ reload(); drawAll(); } });
var LASTD=today();
document.addEventListener("visibilitychange",function(){ if(!document.hidden){ if(today()!==LASTD){ LASTD=today(); S.sug=null; } drawAll(); } });
drawAll(); toParent({type:"sp-ready"});
})();
</script>
</body>
